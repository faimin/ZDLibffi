name: Upgrade libffi

on:
  workflow_dispatch:
    inputs:
      libffi_version:
        description: 'libffi version to upgrade to (e.g. 3.8.0)'
        required: true
        type: string

jobs:
  upgrade:
    name: Upgrade to libffi ${{ inputs.libffi_version }}
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate version format
        env:
          LIBFFI_VERSION: ${{ inputs.libffi_version }}
        run: |
          if [[ ! "${LIBFFI_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '${LIBFFI_VERSION}'. Expected: X.Y.Z"
            exit 1
          fi

      - name: Run upgrade script
        env:
          LIBFFI_VERSION: ${{ inputs.libffi_version }}
        run: |
          ./scripts/upgrade_libffi.sh \
            --libffi-version "${LIBFFI_VERSION}" \
            --skip-xcframework

      - name: Update README references
        env:
          LIBFFI_VERSION: ${{ inputs.libffi_version }}
        run: |
          POD_VERSION="0.${LIBFFI_VERSION//./}.0"
          # Fix release tag URL
          sed -i '' "s|releases/tag/v[0-9]*\.[0-9]*\.[0-9]*|releases/tag/v${LIBFFI_VERSION}|g" README.md
          # Fix SPM version
          sed -i '' "s|from: \"0\.[0-9]*\.0\"|from: \"${POD_VERSION}\"|g" README.md
          # Fix upgrade example command
          sed -i '' "s|--libffi-version [0-9]*\.[0-9]*\.[0-9]*|--libffi-version ${LIBFFI_VERSION}|g" README.md
          sed -i '' "s|--pod-version 0\.[0-9]*\.0|--pod-version ${POD_VERSION}|g" README.md
          # Fix version example in options table
          sed -i '' "s|(e.g. \`[0-9]*\.[0-9]*\.[0-9]*\`)|(e.g. \`${LIBFFI_VERSION}\`)|g" README.md

      - name: Verify build
        run: swift build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: upgrade libffi to ${{ inputs.libffi_version }}"
          branch: upgrade/libffi-${{ inputs.libffi_version }}
          base: main
          title: "feat: upgrade libffi to ${{ inputs.libffi_version }}"
          body: |
            Automated upgrade of libffi to **${{ inputs.libffi_version }}**.

            - Source regenerated via `upgrade_libffi.sh`
            - SPM build verified ✅

            Release notes: https://github.com/libffi/libffi/releases/tag/v${{ inputs.libffi_version }}
