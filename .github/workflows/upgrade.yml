name: Upgrade libffi

on:
  workflow_dispatch:
    inputs:
      libffi_version:
        description: 'libffi version to upgrade to (e.g. 3.8.0)'
        required: true
        type: string

jobs:
  upgrade:
    name: Upgrade to libffi ${{ inputs.libffi_version }}
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run upgrade script
        run: |
          ./scripts/upgrade_libffi.sh \
            --libffi-version ${{ inputs.libffi_version }} \
            --skip-xcframework

      - name: Update README URL
        run: |
          # Fix the release tag URL (upgrade script only replaces display text)
          sed -i '' "s|releases/tag/v[0-9]*\.[0-9]*\.[0-9]*|releases/tag/v${{ inputs.libffi_version }}|g" README.md

      - name: Verify build
        run: swift build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat: upgrade libffi to ${{ inputs.libffi_version }}"
          branch: upgrade/libffi-${{ inputs.libffi_version }}
          title: "feat: upgrade libffi to ${{ inputs.libffi_version }}"
          body: |
            Automated upgrade of libffi to **${{ inputs.libffi_version }}**.

            - Source regenerated via `upgrade_libffi.sh`
            - SPM build verified ✅

            Release notes: https://github.com/libffi/libffi/releases/tag/v${{ inputs.libffi_version }}
