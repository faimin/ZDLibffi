name: CI

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: Pod Lint (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos, watchos, tvos, visionos]
    steps:
      - uses: actions/checkout@v4
      - run: |
          pod lib lint ZDLibffi.podspec --allow-warnings --platforms=${{ matrix.platform }} --skip-tests
          pod lib lint ZDLibffi.podspec --allow-warnings --platforms=${{ matrix.platform }} --use-modular-headers --skip-tests

  spm:
    name: SPM Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  release:
    name: Release XCFramework
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, spm]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build XCFramework
        run: |
          python3 scripts/build_xcframework.py \
            --source Source \
            --output ZDLibffi.xcframework \
            --build-dir build

      - name: Package
        run: zip -ry ZDLibffi.xcframework.zip ZDLibffi.xcframework

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LIBFFI_VER=$(sed -n 's/.*libffi v\([0-9.]*\).*/\1/p' ZDLibffi.podspec | head -1)

          cat > CHANGELOG.md <<EOF
          ## What's Changed

          $(git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)" --no-merges)

          **libffi version:** ${LIBFFI_VER}

          **Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: ZDLibffi.xcframework.zip
